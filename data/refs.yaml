#
# 저작권: 이 파일은 "어디를 봤는지"만 기록한다.
# 수집한 원본 스크린샷은 저장소에 올리지 않는다 (.gitignore).
# 남이 재현하려면 `make collect`를 돌려 각자 로컬에 수집한다.
#
# group:
