# 레퍼런스 평가셋 — 프리미엄 기프트 · 전통 디저트 카테고리
#
# 저작권: 이 파일은 "어디를 봤는지"만 기록한다.
# 수집한 원본 스크린샷은 저장소에 올리지 않는다 (.gitignore).
# 재현하려면 각자 `uv run refscope collect`를 돌려 로컬에 수집한다.
#
# group:
#   competitor — 단정과 직접 겹치는 경쟁군
#   tone       — 카테고리는 다르지만 톤·격을 참고할 브랜드
#   own        — 내 소유 자산 (저작권 안전한 시연·문서용)
#
# page_type:
#   home   — 브랜드 첫인상. 대체로 DOM에 텍스트가 있다
#   detail — 상품 상세. 한국 커머스에서는 대체로 통이미지다 ← 이 PoC의 표적
#
# 두 종류를 일부러 섞어 둔 이유: "상세페이지만 글자가 이미지에 갇힌다"는
# 이 도메인의 특성을 숫자로 보이기 위해서다. (검증 문서 참고)

meta:
  project: 단정 · Danjeong
  category: B2B 프리미엄 답례 선물
  collected_for: Main Quest 2 레퍼런스 리서치 자동 정리기

